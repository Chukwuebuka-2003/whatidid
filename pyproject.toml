[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatidid"
version = "0.1.0"
description = "It interrupts you and asks what you just did, then grades the week against your own goals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "What I Did contributors" }]
keywords = ["time", "journal", "focus", "logging", "local-first", "self-hosted"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
whatidid = "whatidid.cli:main"

[project.urls]
Homepage = "https://github.com/Chukwuebuka-2003/whatidid"

[tool.setuptools]
packages = ["whatidid", "whatidid.graders"]

[tool.setuptools.data-files]
"share/whatidid/web" = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.webmanifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]